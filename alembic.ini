# Alembic configuration.
#
# The database URL is NOT set here — alembic/env.py reads DATABASE_URL via
# backend.config, so credentials never live in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

# Logging is configured by the application (backend/logging_config.py).
